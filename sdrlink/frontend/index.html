<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sdrlink</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111;
        color: #ddd;
        overflow: hidden;
      }
      #app {
        height: 100%;
      }
      input, button, select { font-size: 1rem; padding: 0.35rem; }

      .spectrum-view {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .topbar {
        display: flex;
        gap: 1rem;
        align-items: center;
        padding: 0.5rem 0.75rem;
        background: #1a1a1a;
        border-bottom: 1px solid #333;
        font-size: 0.85rem;
      }
      .topbar button { margin-left: auto; }
      .waterfall-wrap {
        flex: 1 1 auto;
        min-height: 0;
        position: relative;
        display: flex;
      }
      .waterfall {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        background: #000;
        image-rendering: pixelated;
        display: block;
        cursor: crosshair;
      }
      .selection-rect {
        position: absolute;
        top: 0;
        bottom: 0;
        background: rgba(143, 221, 221, 0.18);
        border-left: 1px solid #8fd;
        border-right: 1px solid #8fd;
        pointer-events: none;
      }
      .viewport-overlay {
        position: absolute;
        top: 0.4rem;
        left: 0.5rem;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid #333;
        color: #8fd;
        font-family: ui-monospace, "SF Mono", "Menlo", "Consolas", monospace;
        font-size: 0.75rem;
        padding: 0.15rem 0.4rem;
        pointer-events: none;
        user-select: none;
      }
      .controls {
        display: flex;
        gap: 0.75rem;
        padding: 0.5rem 0.75rem;
        background: #1a1a1a;
        border-top: 1px solid #333;
        flex-wrap: wrap;
      }
      .controls fieldset {
        border: 1px solid #333;
        padding: 0.25rem 0.5rem;
        margin: 0;
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
      .controls legend { font-size: 0.75rem; color: #888; padding: 0 0.25rem; }
      .controls label { display: inline-flex; flex-direction: column; font-size: 0.75rem; color: #888; }
      .controls input, .controls select {
        background: #111;
        color: #ddd;
        border: 1px solid #333;
      }

      .freq-display {
        font-family: ui-monospace, "SF Mono", "Menlo", "Consolas", monospace;
        font-size: 1.6rem;
        letter-spacing: 0.04em;
        padding: 0.25rem 0.5rem;
        background: #000;
        border: 1px solid #333;
        color: #8fd;
        display: inline-flex;
        align-items: baseline;
        user-select: none;
      }
      .freq-group {
        cursor: ns-resize;
        padding: 0 0.1rem;
      }
      .freq-group:hover {
        background: #0b3a2e;
        color: #fff;
      }
      .freq-dot { color: #555; padding: 0 0.05rem; }
      .freq-unit {
        font-size: 0.7em;
        color: #888;
        padding-left: 0.4rem;
      }

      /* Login screen */
      form { padding: 2rem; max-width: 20rem; }
      form input { display: block; width: 100%; margin: 0.25rem 0; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
