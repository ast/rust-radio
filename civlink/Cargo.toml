[package]
name = "civlink"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }

# WebRTC
webrtc = "0.12"
webrtc-media = "0.9"
bytes = "1"

# Audio
cpal = "0.17"
opus = "0.3"
ringbuf = "0.4"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
thiserror = "2"

# Auth
argon2 = "0.5"
rand = "0.9"
base64 = "0.22"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Workspace crates
sidebridge = { path = "../sidebridge" }
url = "2"
pool = { path = "../pool" }
rtp = { path = "../rtp" }

[dev-dependencies]
tempfile = "3"
tower = "0.5"
http-body-util = "0.1"
